projects:
  - title: "Movie Recommender System"
    description: "The Movie Recommendation System is a Python and Flask-based project that uses Content-Based Filtering to recommend movies based on metadata like genres, cast, and descriptions. It leverages machine learning techniques (TF-IDF and KNN) for similarity calculations and features an interactive web interface for real-time recommendations. The project highlights skills in data preprocessing, NLP, and web deployment."
    link: "https://github.com/MohakGangwani/Movie-Recommender-System"
    image: "img/movie-recommendation-system.webp"
    tags: ["Python", "Flask", "NLP", "TF-IDF", "KNN", "Content-Based Filtering", "Web Development"]
  - title: "RAGSwitch"
    description: "Developed a chatbot using Retrieval-Augmented Generation (RAG) for exploring and comparing language models via Ollama. Utilised LangChain to process user-uploaded documents and create vector stores for context-based query handling. Implemented a real-time chat interface with Streamlit, supporting both single-model and model-comparison modes. Integrated OpenAI and Ollama models, providing an efficient document ingestion and retrieval system with real-time response streaming."
    link: "https://github.com/MohakGangwani/RAGSwitch"
    image: "img/ragswitch-project.webp"
    tags: ["RAG", "LangChain", "Streamlit", "OpenAI", "Ollama", "Vector Stores", "LLM", "Chatbot"]
  - title: "Image Captioning Project"
    description: "The Image Captioning Project combines InceptionV3 for image feature extraction and an LSTM-based decoder to generate descriptive captions for images. It preprocesses images and text, uses InceptionV3 to extract features, and trains the LSTM to predict captions from these features. The project demonstrates expertise in deep learning, and sequence modeling, showcasing skills in TensorFlow/Keras and working with image and text data."
    link: "https://github.com/MohakGangwani/Image-Captioning"
    image: "img/image-captioning-project.webp"
    tags: ["Deep Learning", "TensorFlow", "InceptionV3", "LSTM", "Computer Vision", "NLP", "Image Processing"]
  - title: "Marketing Analytics Dashboard"
    description: "The Marketing Analytics Dashboard offers an intuitive interface for visualising key marketing metrics, such as customer sentiment, product conversion rates, and social media engagement trends. Key features include real-time data updates, interactive filtering options, and drill-down capabilities for in-depth analysis. It also provides clear visualizations of performance across multiple channels, enabling businesses to identify trends and make data-driven decisions to optimise marketing efforts."
    link: "https://github.com/MohakGangwani/Marketing-Analytics-Dashboard"
    image: "img/marketing-analytics-dashboard.webp"
    tags: ["Data Visualization", "Dashboard", "Analytics", "Business Intelligence", "Real-time Data", "Marketing Metrics"]
