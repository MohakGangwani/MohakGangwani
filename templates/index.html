{% extends "base.html" %}
{% block content %}
<!-- Hero Section -->
<section id="hero" class="hero section dark-background">

  <img src="{{ url_for('static', filename=content['index']['bg-img']) }}" alt="" data-aos="fade-in">

  <div class="container d-flex flex-column align-items-center justify-content-center text-center" data-aos="fade-up"
    data-aos-delay="100">
    <h2>I am {{ content['index']['name'] }}</h2>
    <p><span class="typed" data-typed-items="{{ content['index']['designations'] }}"></span></p>
  </div>

</section><!-- /Hero Section -->
{% endblock %}
