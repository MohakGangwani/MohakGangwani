{% extends "base.html" %}
{% block content %}
<section id="portfolio" class="portfolio section">
    <div class="container">
        <h2>Projects</h2>
        <div class="row">
            {% for project in content['projects'] %}
            <div class="col-md-4">
                <h3>{{ project['title'] }}</h3>
                <p>{{ project['description'] }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
