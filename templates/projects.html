{% extends "base.html" %}
{% block content %}
<section id="portfolio" class="portfolio section">
    <div class="container">
        <h2>Projects</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for project in content['projects'] %}
            <div class="col">
                <!-- Project Card -->
                <a href="{{ project['link'] }}" target="_blank">
                    <div class="card h-100">
                        <div class="ratio ratio-16x9">
                            <img src="{{ url_for('static', filename=project['image']) }}" class="card-img-top img-fluid"
                                alt="{{ project['title'] }}" style="object-fit: contain;">
                        </div>
                        <div class="card-body">
                            <b><h5 class="card-title">{{ project['title'] }}</h5></b>
                            <p class="card-text">{{ project['description'] }}</p>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
